<!DOCTYPE html>

<head>

<style>
body{margin:0;background:#070b18;color:#fff;font-family:Arial;text-align:center}
.hero{padding:50px 20px;background:radial-gradient(circle at 50% 0%,#1e2a5a,#070b18 70%)}
.coin-3d{width:210px;height:210px;margin:0 auto;animation:spin3d 6s linear infinite;transform-style:preserve-3d}

.btn-cyan{background:#00f0ff;color:#000;box-shadow:0 0 20px #00f0ff}
.btn-gold{background:linear-gradient(90deg,#d4af37,#ffed8a);color:#000}
.metrics{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:25px}
.card{background:#111832;border:1px solid #d4af37;padding:16px;border-radius:14px;min-width:160px}
.card b{color:#d4af37;font-size:24px;display:block}
table{width:95%;max-width:900px;margin:20px auto;border-collapse:collapse;background:#111832;border-radius:12px;overflow:hidden}

<body>
<div class="hero">

<script>
async function load(){
 try{
  const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&price_change_percentage=24h');

  let h='<tr><th>#</th><th>TOKEN</th><th>PRICE</th><th>24H</th></tr>';
  h+=`<tr style="background:#d4af3733;border:2px solid #d4af37"><td>★</td><td><b>RIFFAN 🔥</b></td><td>$0.00017</td><td style="color:#00ff88">+30.72%</td></tr>`;
  d.forEach((c,i)=>{h+=`<tr><td>${i+1}</td><td>${c.symbol.toUpperCase()}</td><td>$${c.current_price}</td><td style="color:${c.price_change_percentage_24h>0?'#00ff88':'#ff5555'}">${c.price_change_percentage_24h?.toFixed(2)}%</td></tr>`});
  document.getElementById('top10').innerHTML=h;
 }catch(e){}
}
load(); setInterval(load,30000);
