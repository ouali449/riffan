<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIFFAN.IO</title>
<style>
body{margin:0;background:#070304;color:#e8d5b5;font-family:Arial;text-align:center}
.yellow{background:linear-gradient(90deg,#d4af37,#f5d76e);color:#000;padding:15px;font-weight:900;font-size:18px;letter-spacing:1px}
.ticker{background:#1a0a0a;padding:10px;white-space:nowrap;overflow:hidden;font-size:12px;font-weight:700;border-bottom:1px solid #333;color:#e8d5b5}
.ticker span{display:inline-block;animation:sc 60s linear infinite}
@keyframes sc{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.header{padding:25px 15px}
.coin-logo{width:85px;height:85px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #f5d76e, #d4af37 40%, #8a6d1b 100%);border:3px solid #f5d76e;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:32px;box-shadow:0 0 25px rgba(212,175,55,.6)}
h1{font-size:32px;letter-spacing:3px;margin:5px 0}
.box{background:#151010;border:1px solid #2a1e1e;padding:14px;margin:10px;border-radius:10px;display:flex;justify-content:space-between;text-align:left}
.gold{border:2px solid #d4af37;background:#1e1805}
.btn{display:block;margin:18px 15px;background:#d4af37;color:#000;padding:16px;border-radius:10px;font-weight:900;text-decoration:none;font-size:18px}
.up{color:#00ff88}.down{color:#ff5555}
</style>
</head>
<body>

<div class="yellow">1. RIFFAN $0.00013 <span style="background:#000;color:#00ff88;padding:4px 10px;border-radius:6px;margin-left:8px">+12.4% LIVE</span></div>

<div class="ticker"><span id="tick">Loading LIVE prices from CoinGecko...</span></div>

<div class="header">
<div class="coin-logo">🐎</div>
<h1>RIFFAN.IO</h1>
<p style="color:#888;font-size:11px">OFFICIAL • odin.fun/token/hjcn</p>
</div>

<div id="list" style="max-width:700px;margin:0 auto"></div>

<a class="btn" href="https://odin.fun/token/hjcn" target="_blank">BUY RIFFAN ON ODIN.FUN 🚀</a>

<script>
async function load(){
 try{
  let r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,solana,tether,binancecoin,ripple,usd-coin,dogecoin,cardano,tron,avalanche-2,shiba-inu,chainlink,polkadot,bitcoin-cash,litecoin&order=market_cap_desc&per_page=15&page=1&price_change_percentage=24h');
  let d=await r.json();
  let t=""; let h='<div class="box gold"><div><b>1. RIFFAN • RIF</b><br><small style="color:#d4af37">$0.00013 • odin.fun/token/hjcn</small></div><div class="up" style="font-weight:900">+12.4%</div></div>';
  let all=[{s:"RIFFAN",p:0.00013,c:12.4}];
  d.forEach((x,i)=>{
    all.push({s:x.symbol.toUpperCase(),p:x.current_price,c:x.price_change_percentage_24h});
    let cl=x.price_change_percentage_24h>=0?'up':'down';
    let sg=x.price_change_percentage_24h>=0?'+':'';
    let pr=x.current_price>=1?x.current_price.toLocaleString():x.current_price;
    t+=(i+2)+". "+x.symbol.toUpperCase()+" $"+pr+" <span class='"+cl+"'>"+sg+x.price_change_percentage_24h.toFixed(1)+"%</span> • ";
    h+='<div class="box"><div><b>'+(i+2)+'. '+x.symbol.toUpperCase()+'</b><br><small style="color:#777">$'+pr+'</small></div><div class="'+cl+'" style="font-weight:900">'+sg+x.price_change_percentage_24h.toFixed(2)+'%</div></div>';
  });
  document.getElementById('tick').innerHTML="1. RIFFAN $0.00013 +12.4% • "+t+t;
  document.getElementById('list').innerHTML=h;
 }catch(e){document.getElementById('tick').innerHTML="1. RIFFAN $0.00013 +12.4% • 2. BTC $64812 • 3. ETH $3245 • 4. SOL $162 •";}
}
load(); setInterval(load,60000);
</script>
</body>
</html>
