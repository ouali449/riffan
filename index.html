<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIFFAN.IO - République du Rif 1923</title>
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;margin:0}
.header{display:flex;justify-content:space-between;padding:20px 40px;align-items:center;border-bottom:1px solid #d4af37}
.logo{color:#d4af37;font-size:32px;font-weight:bold}
.btn-trade{background:#00f0ff;color:#000;padding:15px 30px;border-radius:30px;font-weight:bold;text-decoration:none;font-size:18px}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:40px}
.card{border:1px solid #d4af37;padding:20px;border-radius:15px;text-align:center;background:#11162a}
.card h2{color:#d4af37;font-size:36px;margin:10px 0}
table{width:95%;margin:20px auto;border-collapse:collapse;background:#11162a;border-radius:10px;overflow:hidden}
th{background:#d4af37;color:#000;padding:12px} td{padding:12px;border-bottom:1px solid #222;text-align:center}
.live{color:#00ff88}
</style>
</head>
<body>
<div class="header">
<div class="logo">RIFFAN.IO <small style="font-size:14px;display:block;color:#aaa">République du Rif 1923</small></div>
<a href="https://odin.fun/token/hjcn" target="_blank" class="btn-trade">TRADE ON ODIN.FUN →</a>
</div>

<div class="metrics">
<div class="card"><div>PRICE (USD)</div><h2 id="riffan-price">$0.00017</h2><div class="live">LIVE on ODIN.FUN</div></div>
<div class="card"><div>PRICE (SATS)</div><h2>0.2 sats</h2><div>≈ $0.00017 USD</div></div>
<div class="card"><div>ASCENDED PROGRESS</div><h2>14%</h2><div style="background:#222;height:8px;border-radius:5px"><div style="width:14%;height:8px;background:linear-gradient(90deg,#00f0ff,#d4af37)"></div></div></div>
</div>

<h2 style="text-align:center;color:#d4af37">TOP 10 CRYPTO - LIVE MARKET</h2>
<table id="top10">
<tr><th>#</th><th>TOKEN</th><th>PRICE</th><th>24H CHANGE</th><th>MARKET CAP</th></tr>
</table>

<script>
// يجيب Top 10 الحقيقي من CoinGecko
async function loadTop10(){
  try{
    const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=9&price_change_percentage=24h');
    const data = await res.json();
    let html = `<tr><th>#</th><th>TOKEN</th><th>PRICE</th><th>24H CHANGE</th><th>MARKET CAP</th></tr>`;
    // زيد RIFFAN فالوسط كرقم 3
    html += `<tr style="background:#d4af3733;border:2px solid #d4af37"><td>3</td><td><b>RIFFAN</b> ⭐ NEW</td><td id="riffan-row">$0.00017</td><td style="color:#00ff88">+30.72%</td><td>ASCENDING</td></tr>`;
    data.forEach((c,i)=>{
      let rank = i>=2 ? i+2 : i+1;
      html += `<tr><td>${rank}</td><td><img src="${c.image}" width="20"> ${c.name} (${c.symbol.toUpperCase()})</td><td>$${c.current_price}</td><td style="color:${c.price_change_percentage_24h>0?'#00ff88':'#ff4444'}">${c.price_change_percentage_24h?.toFixed(2)}%</td><td>$${(c.market_cap/1e9).toFixed(2)}B</td></tr>`;
    });
    document.getElementById('top10').innerHTML = html;
  }catch(e){ console.log(e); }
}
loadTop10();
setInterval(loadTop10, 30000); // كل 30 ثانية يتحدث
</script>
</body>
</html>
