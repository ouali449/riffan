body{background:#050302;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;min-height:100vh;display:flex;justify-content:center}

.title p{color:#d4af37;font-size:11px;letter-spacing:1.5px;margin-top:6px;opacity:.9}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:18px 14px}
