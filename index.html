<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0f">

<title>RIFFAN.IO</title>

<style>
*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
background:#090a0f;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

a{
color:inherit;
text-decoration:none;
}

/* HEADER */

.header{
position:sticky;
top:0;
z-index:10;
background:#090a0f;
border-bottom:1px solid #292b35;
}

.nav{
max-width:1200px;
margin:auto;
padding:13px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-weight:900;
letter-spacing:2px;
font-size:20px;
}

.logo-mark{
width:44px;
height:44px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(145deg,#9c0000,#280000);
border:2px solid #d8b45b;
font-size:22px;
}

.trade{
background:#00e5ea;
color:#041014;
font-weight:900;
padding:13px 18px;
border-radius:14px;
}

/* TICKER */

.ticker{
height:50px;
overflow:hidden;
background:#050609;
border-bottom:1px solid #292b35;
display:flex;
align-items:center;
}

.track{
display:flex;
white-space:nowrap;
animation:move 32s linear infinite;
}

.tick{
padding:0 22px;
border-right:1px solid #292b35;
font-size:13px;
}

.up{
color:#17d56b;
}

.down{
color:#ff6868;
}

@keyframes move{
from{
transform:translateX(0);
}
to{
transform:translateX(-50%);
}
}

/* HERO */

.hero{
max-width:1200px;
margin:auto;
padding:55px 20px 35px;
display:grid;
grid-template-columns:1.1fr .9fr;
gap:30px;
align-items:center;
}

.badge{
display:inline-block;
border:1px solid #967633;
color:#e3c36d;
border-radius:30px;
padding:9px 15px;
letter-spacing:1.5px;
font-size:12px;
}

h1{
font-size:clamp(55px,9vw,90px);
margin:20px 0 8px;
line-height:.9;
letter-spacing:-4px;
}

.hero h2{
font-size:30px;
font-weight:500;
margin:0;
color:#d5d6dc;
}

.hero p{
color:#9295a2;
line-height:1.7;
max-width:620px;
}

.buttons{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:22px;
}

.btn{
padding:14px 20px;
border-radius:13px;
font-weight:900;
display:inline-block;
}

.main{
background:#00e5ea;
color:#041014;
}

.secondary{
border:1px solid #454751;
}
