<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a0f">

<title>RIFFAN.IO — Royal Crypto Republic</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#090a0f;
  color:#fff;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(9,10,15,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #292b35;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  letter-spacing:2px;
}

.logo-mark{
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#9c0000,#280000);
  border:2px solid #d7ad4d;
  font-size:21px;
}

.navlinks{
  display:flex;
  gap:22px;
  color:#b8bac4;
  font-size:14px;
}

.navlinks a:hover{
  color:#fff;
}

.trade-small{
  padding:11px 17px;
  border-radius:12px;
  background:#00e5ea;
  color:#041014;
  font-weight:900;
}

/* MOBILE HEADER */
@media(max-width:760px){
  .navlinks{
    display:none;
  }

  .trade-small{
    padding:9px 12px;
    font-size:12px;
  }
}

/* TICKER */
.ticker{
  overflow:hidden;
  white-space:nowrap;
  background:#050609;
  border-bottom:1px solid #262831;
}

.track{
  display:inline-flex;
  min-width:max-content;
  animation:scroll 35s linear infinite;
}

.tick{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:13px 22px;
  border-right:1px solid #252731;
  font-size:13px;
  color:#ddd;
}

.tick b{
  color:#fff;
}

.up{
  color:#18d66b;
}

.down{
  color:#ff6262;
}

@keyframes scroll{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

/* HERO */
.hero{
  max-width:1200px;
  margin:auto;
  padding:65px 20px 40px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:35px;
  align-items:center;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border:1px solid #8e7131;
  border-radius:999px;
  color:#e3c36d;
  font-size:12px;
  letter-spacing:1.5px;
}

h1{
  font-size:clamp(48px,8vw,88px);
  line-height:.9;
  margin:18px 0 12px;
  letter-spacing:-4px;
}

.hero h2{
  margin:0;
  color:#d8d9df;
  font-weight:500;
}

.hero p{
  color:#9295a2;
  line-height:1.7;
  max-width:650px;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:25px;
}

.btn{
  padding:14px 21px;
  border-radius:12px;
  font-weight:900;
  display:inline-block;
}

.btn-main{
  background:#00e5ea;
  color:#041014;
}

.btn-second{
  border:1px solid #464852;
  color:#fff;
}

/* COIN */
.coin-card{
  min-height:370px;
  border-radius:28px;
  border:1px solid #3a3020;
  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(190,150,45,.18),
      transparent 34%
    ),
    linear-gradient(145deg,#180b0b,#090a0f 70%);
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
}

.coin{
  width:230px;
  height:230px;
  border-radius:50%;
  display:grid;
  place-items:center;
  text-align:center;
  background:
    radial-gradient(
      circle at 35% 30%,
      #a92828,
      #650909 52%,
      #220303
    );
  border:9px double #d9b45a;
  box-shadow:
    0 0 55px rgba(214,173,70,.22),
    inset 0 0 25px rgba(0,0,0,.65);
}

.coin .horse{
  font-size:85px;
  filter:drop-shadow(0 5px 5px #000);
}

.coin strong{
  display:block;
  color:#f0d27b;
  letter-spacing:3px;
  font-size:13px;
}

/* STATS */
.stats{
  max-width:1200px;
  margin:0 auto 35px;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  background:#101118;
  border:1px solid #2c2e38;
  border-radius:16px;
  padding:20px;
}

.card small{
  color:#898c99;
  text-transform:uppercase;
  letter-spacing:1px;
}

.card strong{
  display:block;
  font-size:24px;
  margin-top:8px;
}

.green{
  color:#17d56b;
}

.cyan{
  color:#00e5ea;
}

.gold{
  color:#e2bd5e;
}

.red{
  color:#ff6868;
}

/* HERO MOBILE */
@media(max-width:760px){
  .hero{
    grid-template-columns:1fr;
    padding-top:40px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

/* SECTION */
.section{
  max-width:1200px;
  margin:auto;
  padding:25px 20px 60px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin-bottom:18px;
}

.section h2{
  font-size:30px;
  margin:0;
}

.muted{
  color:#858894;
  font-size:13px;
}

/* TABLE */
.table-wrap{
  overflow:auto;
  border:1px solid #2c2e38;
  border-radius:18px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
  background:#101118;
}

th,
td{
  padding:16px;
  border-bottom:1px solid #242630;
  text-align:left;
}

th{
  color:#7f8290;
  font-size:12px;
  text-transform:uppercase;
}

td{
  font-size:14px;
}

.rank{
  color:#777b88;
  width:50px;
}

.symbol{
  font-weight:900;
}

.price{
  text-align:right;
}

.green-cell{
  color:#17d56b;
}

.red-cell{
  color:#ff6868;
}

/* RIFFAN PANEL */
.riffan-panel{
  margin-top:35px;
  padding:25px;
  border-radius:22px;
  border:1px solid #5c4721;
  background:linear-gradient(135deg,#170b0b,#111217);
}

.riffan-head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.riffan-name{
  font-size:25px;
  font-weight:900;
}

.odinstat{
  color:#8d909b;
  font-size:12px;
}

.riffan-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:18px;
}

.riffan-item{
  background:#0b0c11;
  border:1px solid #282a34;
  border-radius:13px;
  padding:15px;
}

.riffan-item small{
  display:block;
  color:#777b88;
}

.riffan-item b{
  display:block;
  margin-top:7px;
  font-size:18px;
}

@media(max-width:760px){
  .riffan-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

/* NEWS */
.news{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.news-card{
  border:1px solid #2c2e38;
  border-radius:18px;
  padding:20px;
  background:#101118;
}

.news-card .tag{
  color:#00e5ea;
  font-size:11px;
  font-weight:900;
}

.news-card h3{
  font-size:18px;
  line-height:1.3;
}

.news-card p{
  color:#888b97;
  font-size:13px;
  line-height:1.6;
}

@media(max-width:760px){
  .news{
    grid-template-columns:1fr;
  }
}

/* FOOTER */
footer{
  border-top:1px solid #292b35;
  padding:35px 20px;
  color:#747783;
  text-align:center;
  font-size:13px;
}

.loading{
  color:#777b88;
}
</style>
</head>
