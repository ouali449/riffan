
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIFFAN.IO</title>
<style>
body{margin:0;background:#0a0506;color:#e8d5b5;font-family:Arial,sans-serif}
.top{padding:14px;text-align:center;background:#000;border-bottom:1px solid #332222;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:bold}
.top span{display:inline-block;animation:scroll 60s linear infinite}
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.header{padding:20px;text-align:center;border-bottom:1px solid #222}
.logo{width:80px;height:80px;border-radius:50%;border:3px solid #d4af37;margin:0 auto 10px;display:block;object-fit:cover;background:#111}
h1{letter-spacing:3px;margin:10px 0 0 0}
p{color:#8a7660;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px;max-width:800px;margin:0 auto}
.box{background:#151010;border:1px solid #2a1a1a;border-radius:10px;padding:14px}
.box b{display:block;font-size:14px;margin-bottom:4px}
.box span{font-size:12px}
.gold{border-color:#d4af37;background:#1e1805}
.up{color:#00ff88}.down{color:#ff5555}
.btn{display:inline-block;margin:20px auto;background:#d4af37;color:#000;padding:14px 30px;border-radius:8px;font-weight:900;text-decoration:none;text-align:center}
.center{text-align:center;padding-bottom:40px}
</style>
</head>
<body>

<div class="top"><span id="ticker">Loading live prices...</span></div>

<div class="header">
<img src="coin.png" class="logo" onerror="this.style.background='#d4af37';this.src='';this.innerHTML='R'">
<h1>RIFFAN.IO</h1>
<p>LIVE CRYPTO TOP 20 - RIFFAN ALWAYS #1</p>
</div>

<div class="grid" id="grid">Loading...</div>

<div class="center">
<a class="btn" href="https://odin.fun" target="_blank">BUY RIFFAN ON ODIN.FUN</a>
</div>

<script>
async function load(){
 try{
  let r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,tether,solana,binancecoin,ripple,usd-coin,dogecoin,cardano,tron,avalanche-2,shiba-inu,chainlink,polkadot,bitcoin-cash,litecoin,pepe,uniswap,ethereum-classic&order=market_cap_desc&per_page=19&page=1&sparkline=false&price_change_percentage=24h');
  let d = await r.json();
  let all = [{symbol:'RIFFAN',current_price:0.00013,change:12.4,gold:true}].concat(d.map(x=>({symbol:x.symbol.toUpperCase(),current_price:x.current_price,change:x.price_change_percentage_24h})));
  
  let t='';
  all.forEach((c,i)=>{
    let cls=c.change>=0?'up':'down';
    let s=c.change>=0?'+':'';
    let pr=c.current_price>=1?c.current_price.toLocaleString():c.current_price;
    t+= (i+1)+'. '+c.symbol+' $'+pr+' <span class="'+cls+'">'+s+c.change.toFixed(1)+'%</span> • ';
  });
  document.getElementById('ticker').innerHTML=t+t;

  let g='';
  all.forEach((c,i)=>{
    let cls=c.change>=0?'up':'down';
    let s=c.change>=0?'+':'';
    let pr=c.current_price>=1?c.current_price.toLocaleString():c.current_price;
    let gold=c.gold?'gold':'';
    g+='<div class="box '+gold+'"><b>'+(i+1)+'. '+c.symbol+'</b><span>$'+pr+'</span><span class="'+cls+'" style="float:right;font-weight:900">'+s+c.change.toFixed(2)+'%</span></div>';
  });
  document.getElementById('grid').innerHTML=g;
 }catch(e){
  document.getElementById('ticker').innerHTML='RIFFAN $0.00013 +12.4% • BTC $64812 -0.8% • ETH $3245 +2.1% • SOL $162 +3.7% •';
  document.getElementById('grid').innerHTML='Error loading - check internet';
 }
}
load();
setInterval(load,60000);
</script>
</body>
</html>
