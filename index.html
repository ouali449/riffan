border-radius:18px;margin:20px auto;max-width:700px;
font-family:Arial;text-align:center">

  <h2>RIFFAN.IO</h2>
  <h3>🚀 العملة الرقمية ديالي</h3>

     target="_blank" rel="noopener noreferrer"
     style="display:inline-block;background:#16a34a;

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIFFAN.IO | Crypto Market</title>
<style>
:root{--bg:#07111f;--panel:#101e30;--line:#24364c;--text:#f4f8ff;--muted:#94a9c0;--cyan:#62e5ee;--green:#55e6a5;--red:#ff7185}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:22px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:25px;font-weight:900} .logo span{color:var(--cyan)}
.ticker{overflow:hidden;white-space:nowrap;background:#0d1b2b;border-bottom:1px solid var(--line);padding:13px 0}
.ticker-track{display:inline-flex;gap:34px;animation:scroll 42s linear infinite}
.tick{font-size:13px}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
main{max-width:1200px;margin:auto;padding:28px 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px}
.btn{border-radius:10px;padding:12px 17px;font-weight:bold;background:var(--cyan);color:#06111d;border:0;cursor:pointer}
table{width:100%;border-collapse:collapse} th,td{padding:15px 12px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.up{color:var(--green)} .down{color:var(--red)}
</style>
</head>
<body>
<header><div class="logo">RIFFAN<span>.IO</span></div></header>
<div class="ticker"><div class="ticker-track" id="ticker">Loading...</div></div>
<main>
<h1>Explore the <span style="color:var(--cyan)">Crypto</span> World.</h1>
<p style="color:var(--muted)">تابع أسعار العملات الرقمية من مكان واحد</p>
<div class="card">
<table><thead><tr><th>العملة</th><th>السعر</th><th>24h</th><th>Market Cap</th></tr></thead>
<tbody id="coins"><tr><td colspan="4">جاري التحميل...</td></tr></tbody></table>
<p id="marketStatus">مصدر البيانات: CoinGecko</p>
<button class="btn" id="retry">إعادة المحاولة</button>
</div>
</main>
<script>
const API="https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=30&page=1&sparkline=false&price_change_percentage=24h";
let marketCoins=[];
const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:n<1?6:2}).format(n);
const changeText=n=>(n>=0?"+":"")+Number(n).toFixed(2)+"%";
const changeClass=n=>Number(n)>=0?"up":"down";
function renderCoins(){const tbody=document.getElementById("coins");tbody.innerHTML=marketCoins.map(c=>`<tr><td>${c.name} (${c.symbol.toUpperCase()})</td><td>${money(c.current_price)}</td><td class="${changeClass(c.price_change_percentage_24h)}">${changeText(c.price_change_percentage_24h)}</td><td>$${c.market_cap.toLocaleString()}</td></tr>`).join("");}
function renderTicker(){const items=marketCoins.map(c=>`<span class="tick">${c.symbol.toUpperCase()} ${money(c.current_price)} <span class="${changeClass(c.price_change_percentage_24h)}">${changeText(c.price_change_percentage_24h)}</span></span>`).join("");document.getElementById("ticker").innerHTML=items+items;}
async function loadPrices(){try{const r=await fetch(API);const data=await r.json();marketCoins=data;renderCoins();renderTicker();document.getElementById("marketStatus").textContent="آخر تحديث: "+new Date().toLocaleString();}catch(e){document.getElementById("marketStatus").textContent="خطأ: "+e.message;}}
document.getElementById("retry").addEventListener("click",loadPrices);
loadPrices(); setInterval(loadPrices,600000);
</script>
</body>
</html>
