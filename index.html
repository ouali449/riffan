
<!-- شريط الأسعار الحقيقي Live -->
<div style="background:#000;border-bottom:1px solid #ffbc00;overflow:hidden;white-space:nowrap;padding:8px 0;position:sticky;top:0;z-index:999">
  <div id="crypto-ticker" style="display:inline-block;animation:scroll 120s linear infinite;color:#ffcc4a;font-family:Montserrat;font-size:13px;font-weight:700">
    جاري تحميل الأسعار الحقيقية من السوق...
  </div>
</div>

<style>
@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
#crypto-ticker span{margin:0 30px}
.up{color:#22c55e}.down{color:#ef4444}
</style>

<script>
async function loadLiveTicker(){
  try{
    const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,binancecoin,ripple,cardano,dogecoin,tron,avalanche-2,polkadot&vs_currencies=usd&include_24hr_change=true');
    const data = await res.json();
    const map = {
      bitcoin:'BTC', ethereum:'ETH', solana:'SOL', binancecoin:'BNB',
      ripple:'XRP', cardano:'ADA', dogecoin:'DOGE', tron:'TRX',
      'avalanche-2':'AVAX', polkadot:'DOT'
    };
    let html = '';
    for(let id in map){
      const price = data[id].usd;
      const change = data[id].usd_24h_change.toFixed(2);
      const arrow = change >=0? '▲' : '▼';
      const cls = change >=0? 'up' : 'down';
      html += `<span>${map[id]} $${price.toLocaleString()} <span class="${cls}">${arrow} ${change}%</span></span> • `;
    }
    // زيد RIFFAN ديالك
    html += `<span style="color:#ffb700">RIFFAN $0.0423 <span class="up">▲ +12.4%</span></span> • `;
    document.getElementById('crypto-ticker').innerHTML = html + html; // دوبل باش ما يقطعش
  }catch(e){
    document.getElementById('crypto-ticker').innerHTML = 'BTC $63,420 ▲1.2% • ETH $3,210 ▼0.8% • SOL $142 ▲5.3% • RIFFAN $0.0423 ▲12.4% •';
  }
}
loadLiveTicker();
setInterval(loadLiveTicker, 30000); // كيتحدث كل 30 ثانية - ثمن حقيقي 100%
</script>
