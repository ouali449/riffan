<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAYSH RIF - ANOUAL 1921</title>
<style>
body{margin:0;background:#1a0f08;color:white;font-family:sans-serif;overflow:hidden}
#topBar{display:flex;justify-content:space-between;background:#8b0000;padding:8px;border-bottom:3px solid gold}
#tokenBox{background:black;border:2px solid gold;padding:4px 12px;border-radius:20px;color:gold}
#gameCanvas{width:100%;height:68vh;background:#d9b88f;display:block}
.btn{background:linear-gradient(#c1272d,#8b0000);border:2px solid gold;color:white;padding:12px;border-radius:10px}
</style>
</head>
<body>
<div id="topBar"><div>ANOUAL 1921</div><div id="tokenBox">💰 <span id="riffan">1250</span> RIFFAN</div></div>
<canvas id="gameCanvas"></canvas>
<div style="display:flex;justify-content:space-around;padding:12px;background:#2a1a0f">
<button class="btn" onclick="placeMujahid()">🧔‍♂️ مجاهد +100</button>
<button class="btn" onclick="doAmbush()" style="background:#006233">⚔️ كمين!</button>
</div>
<script>
// الكود كامل عندي - هاد غير الملخص
// النسخة الكاملة فيها الرسم ديال الجبال والعلم الصحيح والمجاهدين
let riffan=1250, mujahideen=[], spanish=[];
function placeMujahid(){if(riffan<100)return;riffan-=100;mujahideen.push({x:Math.random()*300,y:50});update()}
function doAmbush(){let k=spanish.length;riffan+=k*250;spanish=[];update()}
function update(){document.getElementById('riffan').innerText=riffan}
// اللعبة كاملة راها واجدة عندي فالملف
</script>
</body>
</html>
height: 70vh; 
background: url('anoual-map.jpg')
