<!DOCTYPE html>
<html lang="en">
<head>
<meta
  <!-- TOP STATS بحال CMC -->
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;background:#0e111a">
  <div style="background:#1c1f2d;border-radius:14px;padding:10px">
    <small style="color:#8a8ea1;font-size:10px">Cap. Boursière</small>
    <div style="font-weight:800;font-size:16px;margin-top:4px">€2,23T <span style="color:#ff4d4d;font-size:12px">▼ 4,12%</span></div>
  </div>
  <div style="background:#1c1f2d;border-radius:14px;padding:10px">
    <small style="color:#8a8ea1;font-size:10px">CMC20</small>
    <div style="font-weight:800;font-size:16px;margin-top:4px">$156,94 <span style="color:#ff4d4d;font-size:12px">▼ 4,73%</span></div>
  </div>
  <div style="background:#1c1f2d;border-radius:14px;padding:10px">
    <small style="color:#8a8ea1;font-size:10px">Indice des altcoins</small>
    <div style="font-weight:800;margin-top:4px">33/100</div>
    <div style="height:6px;background:#2a2e42;border-radius:10px;margin-top:6px"><div style="width:33%;height:100%;background:linear-gradient(90deg,#ff3b30,#ffcc00)"></div></div>
  </div>
  <div style="background:#1c1f2d;border-radius:14px;padding:10px;display:flex;justify-content:space-between;align-items:center">
    <div><small style="color:#8a8ea1;font-size:10px">Fear & Greed</small><div style="font-weight:800;font-size:22px;margin-top:4px">63</div></div>
    <div style="width:50px;height:50px;border:4px solid #333;border-top-color:#ffcc00;border-right-color:#00ff88;border-bottom-color:#00ff88;border-radius:50%;transform:rotate(-30deg)"></div>
  </div>
</div>

<!-- TICKER كيتمشى حقيقي -->
<div style="background:#0f0a0a;overflow:hidden;white-space:nowrap;padding:8px 0;border-bottom:1px solid #1c1f2d">
  <div id="real-ticker" style="display:inline-block;animation:scroll 35s linear infinite">⏳ Chargement prix réels...</div>
</div>
<style>@keyframes scroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}</style>

<script>
async function realPrices(){
  try{
    const r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=eur&ids=bitcoin,ethereum,tether,ripple,solana&order=market_cap_desc&price_change_percentage=24h');
    const d = await r.json();
    let h = `<span style="margin-right:40px;color:#f5d76e"><b>RIFFAN</b> $0.0000085 <span style="color:#00ff88">▲ +1.2%</span></span>`;
    d.forEach(c=>{
      const col = c.price_change_percentage_24h>=0?'#00ff88':'#ff4d4d';
      const ar = c.price_change_percentage_24h>=0?'▲':'▼';
      h+=`<span style="margin-right:40px"><b>${c.symbol.toUpperCase()}</b> €${c.current_price.toLocaleString('fr-FR')} <span style="color:${col}">${ar} ${Math.abs(c.price_change_percentage_24h).toFixed(2)}%</span></span>`;
    });
    document.getElementById('real-ticker').innerHTML = h+h; // نعاودو 2 مرات باش ما يبقاش فراغ
  }catch(e){
    document.getElementById('real-ticker').innerHTML = 'BTC €65,408 ▼ 4,23% • ETH €2,075 ▼ 6,08% • USDT €0,86 ▼ 0,05% • XRP €1,11 ▼ 11,16% • SOL €83,90 ▼ 6,25%';
  }
}
realPrices();
</script>
