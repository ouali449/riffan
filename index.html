<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIFFAN MOUNTAIN RACE - Rif to the Moon</title>
<style>
body{margin:0;background:#0a1931;color:#fff;font-family:monospace;text-align:center;overflow:hidden}
#hud{display:flex;justify-content:space-around;background:#1a2f6b;padding:8px;font-weight:bold;color:#ffd700}
canvas{display:block;margin:0 auto;background:#3a7d2e;max-width:100vw}
#ctrl{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px}
.btn{width:80px;height:80px;background:#ffffff33;border:2px solid #fff;border-radius:50%;font-size:30px;display:flex;align-items:center;justify-content:center;user-select:none}
h1{margin:5px;color:#ffd700}
</style>
</head>
<body>
<h1>🏔️ RIFFAN RACE 🏎️</h1>
<div id="hud"><span id="riff">RIFF: 0</span><span>COIN x<span id="coin">0</span></span><span id="best">BEST: 0</span></div>
<canvas id="g" width="400" height="600"></canvas>
<div id="ctrl"><div class="btn" id="L">◀</div><div class="btn" id="R">▶</div></div>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');
let car={x:180,y:500,w:40,h:60}, coins=[], score=0, best=localStorage.getItem('riff_best')||0, keys={}, speed=4;
document.getElementById('best').innerText='BEST: '+best;
function spawn(){coins.push({x:Math.random()*340+10,y:-30})}
setInterval(spawn,600);
function loop(){
 x.fillStyle='#555'; x.fillRect(0,0,400,600);
 x.fillStyle='#333'; x.fillRect(60,0,280,600);
 x.strokeStyle='#ff0'; x.setLineDash([20,20]); x.beginPath(); x.moveTo(200,0); x.lineTo(200,600); x.stroke(); x.setLineDash([]);
 if(keys['ArrowLeft']||keys['a']||L) car.x=Math.max(60,car.x-6);
 if(keys['ArrowRight']||keys['d']||R) car.x=Math.min(300,car.x+6);
 x.fillStyle='#ff2222'; x.fillRect(car.x,car.y,car.w,car.h);
 x.fillStyle='#ffd700'; x.fillRect(car.x+5,car.y-5,30,12); x.fillStyle='#000'; x.font='12px monospace'; x.fillText('RIFF',car.x+6,car.y+3);
 for(let i=coins.length-1;i>=0;i--){
  let co=coins[i]; co.y+=speed;
  x.fillStyle='#ffd700'; x.beginPath(); x.arc(co.x,co.y,14,0,Math.PI*2); x.fill();
  x.fillStyle='#000'; x.font='bold 14px monospace'; x.fillText('R',co.x-5,co.y+4);
  if(co.x>car.x && co.x<car.x+car.w && co.y>car.y && co.y<car.y+car.h){coins.splice(i,1); score++; document.getElementById('riff').innerText='RIFF: '+score; document.getElementById('coin').innerText=score; if(score>best){best=score; localStorage.setItem('riff_best',best); document.getElementById('best').innerText='BEST: '+best;}}
  if(co.y>620) coins.splice(i,1);
 }
 requestAnimationFrame(loop);
}
let L=false,R=false;
document.getElementById('L').ontouchstart=()=>L=true; document.getElementById('L').ontouchend=()=>L=false;
document.getElementById('R').ontouchstart=()=>R=true; document.getElementById('R').ontouchend=()=>R=false;
window.onkeydown=e=>keys[e.key]=true; window.onkeyup=e=>keys[e.key]=false;
loop();
</script>
<p style="font-size:12px">RIFFAN on odin.fun - 0.18 sats - Rif Mountains Morocco</p>
</body>
</html>
