*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0505;color:#fff;font-family:Arial}
.head{text-align:center;padding:28px 16px;background:#140a0a}
.head h1{color:#f5d76e;letter-spacing:5px;font-size:34px}

.ticker{background:#000;border-top:2px solid #d4af37;border-bottom:2px solid #d4af37;padding:10px 0;overflow:hidden}
.ticker-track{white-space:nowrap;animation:run 18s linear infinite;display:inline-block}
.ticker-track span{margin-right:35px;font-weight:900;font-size:14px}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.box{max-width:600px;margin:0 auto;padding:16px}
.item{background:#1a0f0f;border:1px solid #3a2a1a;border-radius:12px;padding:16px;margin-bottom:14px}
.item h3{font-size:15px;margin-bottom:6px}
.item p{color:#9a8a72;font-size:13px}
.btn{display:block;background:linear-gradient(90deg,#d4af37,#f5d76e);color:#000;text-align:center;padding:16px;border-radius:12px;font-weight:900;text-decoration:none;margin:20px 16px;font-size:18px}
.gold{color:#f5d76e}.green{color:#00ff88}.red{color:#ff4444}

<span id="apt-live" style="color:#00e5ff">APT ⏳</span>

<script>
fetch('https://api.coingecko.com/api/v3/simple/price?ids=aptos&vs_currencies=eur&include_24hr_change=true')
.then(r=>r.json())
.then(d=>{
  let p = d.aptos.eur;
  let c = d.aptos.eur_24h_change;
  let col = c>=0 ? '#00ff88' : '#ff4444';
  let arrow = c>=0 ? '▲' : '▼';
  document.getElementById('apt-live').innerHTML = `APT €${p} <span style="color:${col}">${arrow}${Math.abs(c).toFixed(2)}%</span>`;
});
</script>
