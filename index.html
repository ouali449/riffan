<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIFFAN.IO — The Royal Crypto Republic</title>
<style>
:root{--bg:#08090d;--panel:#11131a;--line:#292c36;--gold:#d8b45b;--cyan:#00e5ea;--green:#19d66b;--red:#ff4d5a;--muted:#8e929f}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
a{text-decoration:none;color:inherit}
.header{border-bottom:1px solid var(--line);background:#08090d;position:sticky;top:0;z-index:10}
.nav{max-width:1150px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;letter-spacing:2px}
.logo{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#a60000,#360000);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:25px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.trade{background:var(--cyan);color:#001114;padding:13px 18px;border-radius:14px;font-weight:900}
.ticker{overflow:hidden;border-bottom:1px solid var(--line);background:#050609}
.ticker-track{display:flex;width:max-content;animation:scroll 35s linear infinite}
.item{padding:15px 22px;border-right:1px solid var(--line);font-size:13px;white-space:nowrap}
.item b{margin-left:4px}
.green{color:var(--green)} .gold{color:var(--gold)} .cyan{color:var(--cyan)}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.wrap{max-width:1150px;margin:auto;padding:0 18px}
.hero{display:grid;grid-template-columns:1fr 380px;gap:35px;align-items:center;padding:60px 0 45px;position:relative}
